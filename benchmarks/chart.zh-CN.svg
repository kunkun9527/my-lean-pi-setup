<svg xmlns="http://www.w3.org/2000/svg" width="800" height="430" viewBox="0 0 800 430" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif">
  <style>
    .fg{fill:#1f2328}.mu{fill:#59636e}.up{fill:#d0d7de}.ac{fill:#1a7f37}
    @media (prefers-color-scheme: dark){.fg{fill:#e6edf3}.mu{fill:#9198a1}.up{fill:#3d444d}.ac{fill:#3fb950}}
    .num{font-variant-numeric:tabular-nums}
  </style>
  <text x="24" y="34" class="mu" font-size="14">启动时的常驻上下文，5 个扩展</text>
  <text x="24" y="86" class="ac" font-size="48" font-weight="700">−92.9%</text>
  <text x="222" y="70" class="fg num" font-size="18" font-weight="600">21,293 → 1,506 tokens</text>
  <text x="222" y="92" class="mu" font-size="14">每次请求少 19,787 tokens，功能不变</text>
  <rect x="24" y="116" width="10" height="10" class="up"/><text x="40" y="125" class="mu" font-size="12">锁定上游</text>
  <rect x="150" y="116" width="10" height="10" class="ac"/><text x="166" y="125" class="mu" font-size="12">精简版</text>
  <g font-size="13">
    <g transform="translate(0,150)">
      <text x="24" y="22" class="fg">pi-subagents-lean</text>
      <rect x="250" y="6" width="440" height="11" class="up"/><text x="698" y="16" class="mu num">8,956</text>
      <rect x="250" y="21" width="13.6" height="11" class="ac"/><text x="271.6" y="31" class="fg num" font-weight="600">276 <tspan class="mu" font-weight="400">−96.9%</tspan></text>
    </g>
    <g transform="translate(0,200)">
      <text x="24" y="22" class="fg">billion-context-pi-lean</text>
      <rect x="250" y="6" width="425.9" height="11" class="up"/><text x="683.9" y="16" class="mu num">8,670</text>
      <rect x="250" y="21" width="24.7" height="11" class="ac"/><text x="282.7" y="31" class="fg num" font-weight="600">503 <tspan class="mu" font-weight="400">−94.2%</tspan></text>
    </g>
    <g transform="translate(0,250)">
      <text x="24" y="22" class="fg">rpiv-ask-user-question-lean</text>
      <rect x="250" y="6" width="61.8" height="11" class="up"/><text x="319.8" y="16" class="mu num">1,258</text>
      <rect x="250" y="21" width="10.8" height="11" class="ac"/><text x="268.8" y="31" class="fg num" font-weight="600">220 <tspan class="mu" font-weight="400">−82.5%</tspan></text>
    </g>
    <g transform="translate(0,300)">
      <text x="24" y="22" class="fg">rpiv-todo-lean</text>
      <rect x="250" y="6" width="61.1" height="11" class="up"/><text x="319.1" y="16" class="mu num">1,244</text>
      <rect x="250" y="21" width="17.4" height="11" class="ac"/><text x="275.4" y="31" class="fg num" font-weight="600">354 <tspan class="mu" font-weight="400">−71.5%</tspan></text>
    </g>
    <g transform="translate(0,350)">
      <text x="24" y="22" class="fg">pi-web-access-lean</text>
      <rect x="250" y="6" width="57.2" height="11" class="up"/><text x="315.2" y="16" class="mu num">1,165</text>
      <rect x="250" y="21" width="7.5" height="11" class="ac"/><text x="265.5" y="31" class="fg num" font-weight="600">153 <tspan class="mu" font-weight="400">−86.9%</tspan></text>
    </g>
  </g>
  <text x="24" y="418" class="mu" font-size="11">Token 按 ceil(字符数 / 4) 估算。</text>
</svg>
